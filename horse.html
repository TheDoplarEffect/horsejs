<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bay Horse — Interactive 3D (Three.js)</title>
<style>
  :root {
    --accent: #e8a33d;
    --panel: rgba(16, 20, 26, 0.72);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8e4da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); }
  #app, #app canvas { position: fixed; inset: 0; display: block; }
  .panel {
    position: fixed; z-index: 10;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  #panel { top: 16px; left: 16px; padding: 14px 16px; width: 300px; }
  #panel h1 { margin: 0 0 2px; font-size: 19px; font-weight: 650; letter-spacing: 0.2px; }
  #panel .sub { font-size: 12px; opacity: 0.65; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button {
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 6px 11px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button.active { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 650; }
  .slider { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex: 1; }
  .slider input { flex: 1; accent-color: var(--accent); }
  .slider span { font-variant-numeric: tabular-nums; opacity: 0.8; width: 42px; text-align: right; }
  .toggles label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; opacity: 0.9; cursor: pointer; }
  .toggles input { accent-color: var(--accent); }
  .gaitLabel { font-size: 12px; font-weight: 650; color: var(--accent); }
  .dim { font-size: 11px; opacity: 0.55; margin-left: auto; }
  #info { left: 16px; bottom: 16px; padding: 12px 14px; max-width: 320px; }
  #info b { font-size: 14px; color: var(--accent); }
  #info p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; opacity: 0.85; }
  .hidden { display: none !important; }
  #tooltip {
    position: fixed; z-index: 20; pointer-events: none;
    background: rgba(10, 12, 16, 0.88);
    border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 8px;
    font-size: 12px; font-weight: 600; color: var(--accent);
    transform: translate(14px, 14px);
    white-space: nowrap;
  }
  #hint {
    position: fixed; right: 14px; bottom: 12px; z-index: 10;
    font-size: 11px; opacity: 0.55; text-align: right; line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none;
  }
  #err {
    position: fixed; inset: auto 16px 16px auto; z-index: 99; max-width: 46vw;
    background: #4a1414; border: 1px solid #a33; color: #ffd9d9;
    padding: 10px 14px; border-radius: 10px; font: 12px/1.5 ui-monospace, monospace;
    white-space: pre-wrap;
  }
  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: #0b0e12; color: var(--text); font-size: 14px; letter-spacing: 0.4px;
    transition: opacity 0.5s; opacity: 1;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="panel" id="panel">
    <h1>🐴 Bay Horse</h1>
    <div class="sub">Procedural Three.js · click a body part to inspect it</div>
    <div class="row" id="gaits">
      <button data-gait="idle" class="active">Idle</button>
      <button data-gait="walk">Walk</button>
      <button data-gait="trot">Trot</button>
      <button data-gait="gallop">Gallop</button>
    </div>
    <div class="row">
      <label class="slider">Speed
        <input id="speed" type="range" min="0.3" max="2.2" step="0.05" value="1" />
        <span id="speedVal">1.00×</span>
      </label>
    </div>
    <div class="row toggles">
      <label><input id="autoRotate" type="checkbox" /> Auto-rotate</label>
      <label><input id="shadows" type="checkbox" checked /> Shadows</label>
      <button id="resetCam">Reset view</button>
    </div>
    <div class="row"><span id="gaitLabel" class="gaitLabel">Idle</span><span class="dim" id="posLabel"></span></div>
  </div>

  <div id="info" class="panel hidden">
    <b id="infoTitle"></b>
    <p id="infoText"></p>
  </div>

  <div id="tooltip" class="hidden"></div>
  <div id="hint">Drag&nbsp;·&nbsp;orbit&nbsp;&nbsp;Scroll&nbsp;·&nbsp;zoom&nbsp;&nbsp;Right-drag&nbsp;·&nbsp;pan<br/>
    Click&nbsp;ground&nbsp;·&nbsp;horse walks there&nbsp;&nbsp;Click&nbsp;part&nbsp;·&nbsp;inspect<br/>
    Keys&nbsp;1–4&nbsp;·&nbsp;gaits&nbsp;&nbsp;Space&nbsp;·&nbsp;gallop burst</div>
  <div id="loading">loading horse…</div>
  <div id="err" class="hidden"></div>
